<!doctype html>
<html>
  <body>
    <tokmon-workbench id="workbench" role="application">
      <header id="menu-bar" data-native="tokmon.menu-bar"></header>
      <div id="workbench-body">
        <aside id="sidebar" data-native="tokmon.sidebar"></aside>
        <main id="conversation" data-native="tokmon.conversation">
          <header id="conversation-header"></header>
          <section id="timeline"></section>
          <footer id="composer-band">
            <section id="composer"></section>
          </footer>
        </main>
        <aside id="viewer" data-native="tokmon.workspace">
          <header id="viewer-header"></header>
          <div id="viewer-body">
            <section id="document"></section>
            <nav id="explorer"></nav>
          </div>
        </aside>
      </div>
    </tokmon-workbench>
  </body>
</html>
